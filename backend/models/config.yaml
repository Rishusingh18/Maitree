system:
  station_id: DMRC_STN_042
  platform_id: PL_DOWN_01
  camera_id: CCTV_CAM_03
  source: http://10.243.108.190:8080/video
  fps_target: 25.0
  frame_skip: 1
  input_resolution:
  - 1920
  - 1080
perception:
  model_name: yolov8n-pose.pt
  confidence_threshold: 0.18
  iou_threshold: 0.45
  device: cpu
  inference_size: 480 # YOLO input resolution for real-time CPU performance (>=30 FPS)
  frame_skip: 1 # Run inference every N frames (1 = full rate, 2 = 2x speed)
tracking:
  tracker_type: bytetrack
  track_high_thresh: 0.22
  track_low_thresh: 0.12
  new_track_thresh: 0.18
  track_buffer: 30
  match_thresh: 0.6
