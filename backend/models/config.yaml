  # Optional ignore zone (e.g. seating/vending areas where detections are discarded)
  ignore: []
train_state:
  provider: simulated
  default_state: ABSENT
  schedule_file: data/train_schedule.json
events:
  # Consecutive frames inside yellow band to trigger LINE_CROSSING
  line_crossing_consecutive_frames: 4
  # Consecutive frames inside track bed to trigger TRACK_INTRUSION
  track_intrusion_consecutive_frames: 3
  # Minimum observation duration frames before confirming fall or jump motion
  min_motion_duration_frames: 4
  # Minimum cumulative vertical drop displacement (pixels) required for ACCIDENTAL_FALL
  fall_min_displacement_px: 10.0
  # Vertical drop velocity (pixels/frame) to classify an ACCIDENTAL_FALL
  fall_drop_velocity_threshold: 18.0
  # Torso angle deviation from vertical (degrees) indicating horizontal body collapse
  fall_angle_threshold: 40.0
  # Minimum cumulative displacement (pixels) required for DELIBERATE_JUMP
  jump_min_displacement_px: 8.0
  # Number of platform edge approach frames evaluated before jump leap
  jump_approach_frames: 4
  # Leaping downward vertical velocity threshold (pixels/frame) for DELIBERATE_JUMP
  jump_vertical_velocity_threshold: 12.0
  # Minimum forward/downward velocity to distinguish deliberate jump from normal walking
  jump_forward_velocity_threshold: 8.0
  # Temporal window of pose frames retained for temporal classification
  temporal_window_size: 15
gesture:
  detection_window_frames: 18
  min_persistence_frames: 2
  max_cooldown_frames: 20
  use_macro_fallback: true
escalation:
  auto_escalate_timer_sec: 60
  ets_human_confirmation_required: true
  ets_confirmation_timeout_sec: 5.0
  webhook_url: http://127.0.0.1:5000/api/alert
  alert_log_file: logs/safety_audit.log
buzzer:
  # Enable/disable laptop hardware buzzer audio
  audio_enabled: true
  # Seconds person must be clear of danger zone before buzzer turns off
  clear_timeout_sec: 4.0
  # Severity frequencies (Hz) and timings (ms)
  l1_frequency: 800
  l1_duration_ms: 150
  l2_frequency: 1200
  l2_beep_ms: 200
  l2_pause_ms: 100
  l3_low_freq: 1800
  l3_high_freq: 2200
overlooker:
  # Cooldown between pings of the same incident type (seconds)
  cooldown_sec: 10.0
  # Audit log file for dispatched notifications
  audit_log_file: logs/overlooker_audit.log
  # Windows desktop notification toast
  desktop_notification: true
  # Optional outbound push (system works 100% offline when disabled)
  ntfy:
    enabled: false
    topic: ""
    server: "https://ntfy.sh"
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
